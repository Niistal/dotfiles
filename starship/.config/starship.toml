add_newline = true

format = "$directory  $git_branch\n$character"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold blue"
format = "[$path]($style)"

[git_branch]
format = "[$branch]($style)"
style = "dimmed white"

[character]
success_symbol = "[❯](bold #0A84FF) "
error_symbol = "[❯](bold #FF453A) "
